<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComradeBite Registration</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://www.gstatic.com https://www.googleapis.com 'unsafe-inline'; img-src 'self' data:;">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="card">
        <div class="brand">Comrade<span>Bite</span></div>
        <p class="lead">Create your account to join the community.</p>
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Your full name">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com">
        <label for="password">Password</label>
        <div style="position: relative;">
            <input id="password" type="password" placeholder="Create a strong password" style="padding-right: 40px; margin-bottom: 0;">
            <span onclick="togglePassword('password', this)" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); display: flex; align-items: center;" title="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
        </div>
        <label for="confirm-password">Confirm Password</label>
        <div style="position: relative;">
            <input id="confirm-password" type="password" placeholder="Repeat your password" style="padding-right: 40px; margin-bottom: 0;">
            <span onclick="togglePassword('confirm-password', this)" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); display: flex; align-items: center;" title="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
        </div>
        <button class="button" id="reg-btn" onclick="registerUser()">Create Account</button>
        <div class="error" id="error"></div>
        <div class="link-row">Already have an account? <a href="login.html">Login here</a></div>
    </div>
    <script>
        const cfg = { apiKey: "AIzaSyDzzNgX8oEq_pmLJwUk1MJ3404eaDl7Ge4", authDomain: "comradebite-c0265c98.firebaseapp.com", databaseURL: "https://comradebite-c0265c98-default-rtdb.firebaseio.com", projectId: "comradebite-c0265c98" };
        firebase.initializeApp(cfg);
        const auth = firebase.auth();
        const db = firebase.database();

        const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        function togglePassword(id, el) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                el.innerHTML = eyeClosed;
                el.title = "Hide password";
            } else {
                input.type = 'password';
                el.innerHTML = eyeOpen;
                el.title = "Show password";
            }
        }

        async function registerUser() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('error');
            const btn = document.getElementById('reg-btn');
            errorEl.innerText = '';

            if (!name || !email || !password || !confirm) {
                errorEl.innerText = 'Please fill all fields.';
                return;
            }
            if (password !== confirm) {
                errorEl.innerText = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Registering...';

            try {
                // 1. Create the Auth Account
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // 2. Capture details into Database immediately
                await db.ref(`users/${user.uid}/profile`).set({
                    name: name,
                    email: email,
                    createdAt: Date.now()
                });

                // Redirect to login/home
                window.location.href = 'index.html';
            } catch (err) {
                errorEl.innerText = err.message;
                btn.disabled = false;
                btn.innerText = 'Create Account';
            }
        }
    </script>
</body>
</html>
