<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComradeBite Login</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #080c14; --card: rgba(15, 23, 42, 0.95); --text: #f8fafc; --muted: #94a3b8; --accent: #22d3ee; --accent-2: #10b981; --border: rgba(255,255,255,0.12); --danger: #f43f5e; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: 'Inter', sans-serif; color: var(--text); background: radial-gradient(circle at top, rgba(34,211,238,0.12), transparent 24%), linear-gradient(180deg, rgba(8,12,20,0.96), rgba(8,12,20,0.96)), url('https://images.unsplash.com/photo-1528756514091-dee0f8d6e11c?auto=format&fit=crop&q=80&w=1600'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 34px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); backdrop-filter: blur(12px); }
        .brand { font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 900; margin: 0 0 18px; letter-spacing: -0.04em; }
        .brand span { color: var(--accent); }
        p.lead { margin: 0 0 24px; color: var(--muted); line-height: 1.7; }
        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 18px; }
        input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text); outline: none; font-size: 15px; }
        input::placeholder { color: rgba(255,255,255,0.55); }
        .button { width: 100%; margin-top: 26px; padding: 16px 18px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #000; font-weight: 800; font-size: 15px; cursor: pointer; }
        .button:disabled { opacity: 0.5; cursor: not-allowed; }
        .link-row { margin-top: 18px; font-size: 14px; color: var(--muted); text-align: center; }
        .link-row a { color: var(--accent); text-decoration: none; }
        .error { margin-top: 16px; color: var(--danger); font-size: 13px; min-height: 18px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">Comrade<span>Bite</span></div>
        <p class="lead">Enter your email and password to login.</p>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autofocus>
        <label for="password">Password</label>
        <div style="position: relative;">
            <input id="password" type="password" placeholder="Your password" onkeydown="if(event.key==='Enter') handleLogin()" style="padding-right: 40px; margin-bottom: 0;">
            <span onclick="togglePassword('password', this)" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--muted); display: flex; align-items: center;" title="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
        </div>
        <button class="button" id="auth-btn" onclick="handleLogin()">Login</button>
        <div class="error" id="error"></div>
        <div class="link-row">Don't have an account? <a href="register.html">Register instead</a></div>
    </div>
    <script>
        const cfg = { apiKey: "AIzaSyDzzNgX8oEq_pmLJwUk1MJ3404eaDl7Ge4", authDomain: "comradebite-c0265c98.firebaseapp.com", databaseURL: "https://comradebite-c0265c98-default-rtdb.firebaseio.com", projectId: "comradebite-c0265c98" };
        firebase.initializeApp(cfg);
        const auth = firebase.auth();
        const db = firebase.database();

        let isManualLogin = false;

        const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        function togglePassword(id, el) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                el.innerHTML = eyeClosed;
                el.title = "Hide password";
            } else {
                input.type = 'password';
                el.innerHTML = eyeOpen;
                el.title = "Show password";
            }
        }

        auth.onAuthStateChanged(u => { 
            if(u) {
                // REAL-TIME CHECK: Ensure credentials exist in the Database before entering
                db.ref(`users/${u.uid}/profile`).once('value', s => {
                    if (s.exists()) {
                        window.location.href = 'index.html';
                    } else {
                        // Data not found in database - block entry
                        auth.signOut();
                        if (isManualLogin) {
                            document.getElementById('error').innerText = 'Credentials not found in Database. Please register first.';
                        }
                        document.getElementById('auth-btn').disabled = false;
                        document.getElementById('auth-btn').innerText = 'Login';
                    }
                });
            }
        });

        async function handleLogin() {
            isManualLogin = true;
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const btn = document.getElementById('auth-btn');

            errorEl.innerText = '';
            if (!e || !p) {
                errorEl.innerText = 'Please enter both email and password.';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Verifying credentials...';

            try {
                // Verify Auth Credentials
                await auth.signInWithEmailAndPassword(e, p);
                btn.innerText = 'Checking profile...';
                // The onAuthStateChanged listener will handle the redirect
            } catch(err) {
                errorEl.innerText = "Login failed: " + err.message;
                btn.disabled = false;
                btn.innerText = 'Login';
            }
        }
    </script>
</body>
</html>
